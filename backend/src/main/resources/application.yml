spring:
  application:
    name: ziplink
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ziplink}
    username: ${DATABASE_USERNAME:ziplink}
    password: ${DATABASE_PASSWORD:ziplink}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: Ziplink
    description: Short links. Smart insights.

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ziplink:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    name: ${GUEST_COOKIE_NAME:ziplink_guest}
    secure: ${COOKIE_SECURE:false}
    same-site: Lax
    max-age-days: 400
  session:
    cookie-name: ${SESSION_COOKIE_NAME:ziplink_session}
    max-age-days: ${SESSION_MAX_AGE_DAYS:14}
  rate-limit:
    create-per-minute: ${CREATE_RATE_LIMIT_PER_MINUTE:20}
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  clicks-async: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId}] %logger{36} - %msg%n"
