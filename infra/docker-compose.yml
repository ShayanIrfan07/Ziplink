services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ziplink
      POSTGRES_USER: ziplink
      POSTGRES_PASSWORD: ziplink
    ports:
      - "5433:5432"
    volumes:
      - ziplink_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziplink -d ziplink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ziplink_pg:
